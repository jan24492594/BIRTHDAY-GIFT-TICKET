<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy 20 Honey</title>

  <!-- Quicksand Font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

  <!-- PAGE 1 -->
  <div class="page page-1 active">
    <img src="letter.png" class="letter" onclick="openLetter()">
    <h2>Happy 20 Honey ♥️🫣🫂</h2>

    <!-- HEART GIF -->
    <img src="heart-gift.gif" class="heart">
  </div>

  <!-- PAGE 2 -->
  <div class="page page-2">
    <h3>🎟 Birthday Gift Ticket</h3>

    <div class="ticket-container" onclick="flipTicket()">
      <div class="ticket-inner" id="ticketInner">

        <!-- FRONT -->
        <div class="ticket-face ticket-front">
          <img src="ticket-front.png">
        </div>

        <!-- BACK -->
        <div class="ticket-face ticket-back">
          <img src="ticket-back.png" class="ticket-bg">
          <img src="nike.png" class="nike-on-ticket">
        </div>

      </div>
    </div>

    <p class="subtext">
      Here is your birthday gift ticket, Piguu 🐽🫣❤️‍🩹
    </p>
  </div>

  <!-- PAGE 3 -->
  <div class="page page-3">
    <img src="confetti.gif" class="confetti">

    <div class="drop-text">
      <p>Happy Birthday Honey</p>
      <p>I love you forever ♥️👉🏻👈🏻💋</p>
    </div>

    <img src="pig-kiss.gif" class="pig">

    <!-- FINAL CUTESYY GIF -->
    <img src="cutesyy.gif" class="cutesyy">
  </div>

</div>

<script src="script.js"></script>
</body>

</html>
